name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z; it must equal xcprivacy-gate --version on main.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=release::releases run only from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the version against the tags
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=release::version $VERSION is not X.Y.Z"
            exit 1
          fi
          latest=$(git tag --list 'v*' | sed -n -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -n "$latest" ] && ! printf '%s\n' "$latest" "$VERSION" | sort -C -u -t. -k1,1n -k2,2n -k3,3n; then
            echo "::error title=release::version $VERSION is not greater than the latest tag v$latest"
            exit 1
          fi
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release --force-resolved-versions
      - name: Check the version against the tool
        run: |
          tool=$(.build/release/xcprivacy-gate --version)
          if [ "$tool" != "$VERSION" ]; then
            echo "::error title=release::xcprivacy-gate --version prints $tool, not $VERSION; bump ToolVersion.current in a pull request first"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Self-test
        run: .build/release/xcprivacy-gate self-test
      - name: Tag the tested commit
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "v$VERSION" -m "xcprivacy-gate $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules_changed=$(git log -1 --format=%cs -- Rules)
          gh release create "v$VERSION" --verify-tag --generate-notes --notes "Apple rules last changed $rules_changed"
